<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if reservation %}
            Luxury Wheels - Edit Reservation
        {% else %}
            Luxury Wheels - Add Reservation
        {% endif %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/dashboard-page">
                Luxury Wheels
            </a>

            <span class="navbar-text text-light">
                {{ user_name }}
            </span>

        </div>
    </nav>


    <div class="container mt-4">

        <h2>
            {% if reservation %}
                Edit Reservation
            {% else %}
                Add Reservation
            {% endif %}
        </h2>


        {% if error %}

        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" class="mt-4">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Client</label>

                    <select name="client_id"
                            class="form-select"
                            required>

                        {% for client in clients %}

                        <option value="{{ client.id }}"
                            {% if reservation and reservation.client_id == client.id %}
                                selected
                            {% endif %}>

                            {{ client.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">Vehicle</label>

                    <select name="vehicle_id"
                            class="form-select"
                            required>

                        {% for vehicle in vehicles %}

                        <option value="{{ vehicle.id }}"
                            {% if reservation and reservation.vehicle_id == vehicle.id %}
                                selected
                            {% endif %}>

                            {{ vehicle.brand }} {{ vehicle.model }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">Payment Method</label>

                    <select name="payment_method_id"
                            class="form-select"
                            required>

                        {% for payment_method in payment_methods %}

                        <option value="{{ payment_method.id }}"
                            {% if reservation and reservation.payment_method_id == payment_method.id %}
                                selected
                            {% endif %}>

                            {{ payment_method.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">Start Date</label>

                    <input type="date"
                        name="start_date"
                        class="form-control"
                        value="{{ reservation.start_date if reservation else '' }}"
                        required>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">End Date</label>

                    <input type="date"
                        name="end_date"
                        class="form-control"
                        value="{{ reservation.end_date if reservation else '' }}"
                        required>

                </div>

            </div>


            <button type="submit"
                    class="btn btn-primary">
                {% if reservation %}
                    Update Reservation
                {% else %}
                    Save Reservation
                {% endif %}
            </button>

            <a href="/reservations-page"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
