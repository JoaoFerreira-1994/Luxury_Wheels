{% include "includes/header.html" %}
{% include "includes/navbar.html" %}


    <div class="container mt-4">

        <h2>
            {% if client %}
                Edit Client
            {% else %}
                Add Client
            {% endif %}
        </h2>

        {% if error %}
            <div class="alert alert-danger mt-3">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="mt-4">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Name</label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ client.name if client else '' }}"
                           required>
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">NIF</label>

                    <input type="text"
                           name="nif"
                           class="form-control"
                           value="{{ client.nif if client else '' }}"
                           required>
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ client.email if client else '' }}">
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ client.phone if client else '' }}">
                </div>


                <div class="col-md-12 mb-3">
                    <label class="form-label">Address</label>

                    <input type="text"
                           name="address"
                           class="form-control"
                           value="{{ client.address if client else '' }}">
                </div>

            </div>


            <button type="submit" class="btn btn-primary">

                {% if client %}
                    Update Client
                {% else %}
                    Save Client
                {% endif %}

            </button>

            <a href="/clients-page" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

{% include "includes/footer.html" %}
